name: Draft release

on:
  release:
    types:
      - created

jobs:
  draft-release:
    name: Fill in release notes from commits
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish }}

      - name: Generate changelog and update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_tag="${{ github.event.release.tag_name }}"
          current_ref="${{ github.event.release.target_commitish }}"
          [ -z "$current_ref" ] && current_ref="HEAD"

          # The tag may not exist yet (e.g. a draft release with a new tag,
          # which GitHub only creates on publish), so sort existing tags
          # instead of relying on the new tag being present.
          previous_tag=$(git tag --sort=-v:refname | grep -v "^${current_tag}$" | head -n1 || true)

          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${current_ref}"
          else
            range="$current_ref"
          fi

          # Order defines both category precedence and output order.
          order=(
            "🚀 New Features"
            "🐛 Bug Fixes"
            "♻️ Refactoring"
            "⚡ Performance"
            "📚 Documentation"
            "🧪 Tests"
            "🧹 Chores"
            "📦 Other Changes"
          )
          declare -A pattern=(
            ["🚀 New Features"]='^(feat|add|new|implement|introduc)'
            ["🐛 Bug Fixes"]='^(fix|bug|patch|resolve|correct)'
            ["♻️ Refactoring"]='^(refactor|cleanup|clean-up|restructure)'
            ["⚡ Performance"]='^(perf|optimi[sz])'
            ["📚 Documentation"]='^(docs?|readme)'
            ["🧪 Tests"]='^tests?'
            ["🧹 Chores"]='^(chore|bump|update|upgrade|deps?|dependenc|ci|build|style)'
          )
          declare -A categorized

          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }

          while IFS='|' read -r subject hash; do
            [ -z "$subject" ] && continue
            lower=$(tr '[:upper:]' '[:lower:]' <<< "$subject")
            line="- ${subject} (${hash})"$'\n'

            # Commits like "fix something + add something else" are split on
            # "+" and each clause is categorized independently, so the commit
            # can end up listed under several categories.
            declare -A seen=()
            matched_keys=()
            IFS='+' read -ra clauses <<< "$lower"
            for clause in "${clauses[@]}"; do
              clause="$(trim "$clause")"
              for key in "${order[@]}"; do
                [ "$key" = "📦 Other Changes" ] && continue
                if [[ "$clause" =~ ${pattern[$key]} ]]; then
                  if [ -z "${seen[$key]:-}" ]; then
                    matched_keys+=("$key")
                    seen["$key"]=1
                  fi
                  break
                fi
              done
            done
            unset seen

            if [ ${#matched_keys[@]} -eq 0 ]; then
              matched_keys=("📦 Other Changes")
            fi

            for key in "${matched_keys[@]}"; do
              categorized["$key"]+="$line"
            done
          done < <(git log "$range" --no-merges --pretty=format:'%s|%h')


          notes=""
          for key in "${order[@]}"; do
            if [ -n "${categorized[$key]:-}" ]; then
              notes+="## ${key}"$'\n'"${categorized[$key]}"$'\n'
            fi
          done
          [ -z "$notes" ] && notes="- No changes recorded"

          gh release edit "$current_tag" --notes "$notes"

