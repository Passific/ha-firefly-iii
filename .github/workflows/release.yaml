name: Release

on:
  release:
    types:
      - published

jobs:
  release:
    name: Set version in manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set version in manifest
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          jq --arg version "$version" '.version = $version' \
            custom_components/firefly_iii/manifest.json > manifest.json.tmp
          mv manifest.json.tmp custom_components/firefly_iii/manifest.json

      - name: Zip the integration directory
        run: |
          cd custom_components/firefly_iii
          zip -r firefly_iii.zip ./

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/firefly_iii/firefly_iii.zip
