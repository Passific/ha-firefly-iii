rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: |
      No custom actions are defined.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: exempt
    comment: |
      No explicit parallel updates are defined.
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: |
      Firefly III is a self-hosted web application reachable by URL and API
      token; there is no network protocol (zeroconf/dhcp/ssdp/usb) that could
      be used to discover or re-discover an instance.
  discovery:
    status: exempt
    comment: |
      Firefly III instances cannot be discovered on the network; the user
      must provide the URL and a personal access token manually.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: exempt
    comment: |
      All entities are primary sensors reflecting user financial data; none
      of them are diagnostic or configuration entities.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: |
      All entities represent commonly useful financial data and are
      inexpensive to poll, so none are disabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: |
      There are currently no known error scenarios for this integration that
      would benefit from a repair issue instead of the existing
      reauthentication/reconfiguration flows.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
